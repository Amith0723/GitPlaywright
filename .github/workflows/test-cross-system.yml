name: Cross-System Tests

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 2:00 AM UTC
  workflow_dispatch:

jobs:
  test-cross-system:
    name: Run Cross-System Integration Specs
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Cross-System Tests
        run: npx playwright test --config=config/playwright.config.ts --project=cross-system

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cross-system-report
          path: playwright-report/
          retention-days: 14
